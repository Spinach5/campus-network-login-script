name: Build for Windows, Linux, macOS

on:
  push:
    tags:
      - 'v*'             # 当推送 v1.0.0 等 tag 时触发
  workflow_dispatch:     # 支持手动触发

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: campus-net-login-windows
            executable_ext: .exe
          - os: ubuntu-latest
            artifact_name: campus-net-login-linux
            executable_ext: ''
          - os: macos-latest
            artifact_name: campus-net-login-macos
            executable_ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name campus-net-login school_login.py

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/campus-net-login${{ matrix.executable_ext }}

  # ========== 新增：自动发布到 Release ==========
  release:
    needs: build          # 等待 build 任务完成
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')  # 仅在 tag 推送时发布
    permissions:
      contents: write     # 必须授予写入 Release 的权限
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts  # 将所有构件下载到 artifacts 目录下

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}          # Release 标题，使用 tag 名
          body: |
            ## 校园网自动登录工具 ${{ github.ref_name }}
            ### 更新内容
            - 自动构建发布
            - 支持 Windows / Linux / macOS
          draft: false
          prerelease: false
          files: |
            artifacts/**/*   # 上传 artifacts 目录下的所有文件

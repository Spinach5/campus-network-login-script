name: Build and Package for Windows, Linux, macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: campus-net-login-windows
            executable_ext: .exe
          - os: ubuntu-latest
            artifact_name: campus-net-login-linux
            executable_ext: ''
          - os: macos-latest
            artifact_name: campus-net-login-macos
            executable_ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --noconsole --icon=icon.ico --name campus-net-login school_login.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --icon=icon.ico --name campus-net-login school_login.py

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onefile --icon=icon.ico --name campus-net-login school_login.py

      # ---------- Linux 专用：使用 fpm 打包成 deb/rpm ----------
      - name: Install fpm (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full
          sudo gem install fpm

      - name: Get version from tag
        if: runner.os == 'Linux' && github.ref_type == 'tag'
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Fallback version for manual run
        if: runner.os == 'Linux' && github.ref_type != 'tag'
        run: echo "VERSION=0.0.0" >> $GITHUB_ENV

      - name: Package with fpm (deb)
        if: runner.os == 'Linux'
        run: |
          fpm -s dir -t deb -n campus-net-login \
            -v ${{ env.VERSION }} \
            --prefix /usr/local/bin \
            --description "Campus network auto-login tool" \
            --maintainer "Spinach super_spinach@qq.com" \
            --license "MIT" \
            --url "https://github.com/Spinach5/campus-network-login-script/" \
            -f ./dist/campus-net-login

      - name: Package with fpm (rpm)
        if: runner.os == 'Linux'
        run: |
          fpm -s dir -t rpm -n campus-net-login \
            -v ${{ env.VERSION }} \
            --prefix /usr/local/bin \
            --description "Campus network auto-login tool" \
           --maintainer "Spinach super_spinach@qq.com" \
            --license "MIT" \
            --maintainer "Spinach super_spinach@qq.com" \
            -f ./dist/campus-net-login

      # ---------- 上传所有构建产物 ----------
      - name: Upload artifact (generic)
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/campus-net-login${{ matrix.executable_ext }}

      - name: Upload .deb package (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: campus-net-login-linux-deb
          path: ./campus-net-login*.deb

      - name: Upload .rpm package (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: campus-net-login-linux-rpm
          path: ./campus-net-login*.rpm

  # ---------- 自动发布到 Release ----------
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List all downloaded files
        run: ls -R artifacts

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## 校园网自动登录工具 ${{ github.ref_name }}
            ### 更新内容
            - 自动构建并打包为各平台可执行文件及 Linux 安装包
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
